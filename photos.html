<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fishguesser — photo check</title>
<meta name="description" content="Step through every fish photo one at a time to check the pictures.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128247;</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body class="review-body">

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">📷</span>
    <span class="brand-name">Photo check</span>
    <span class="species-count" id="speciesCount"></span>
  </div>
  <div class="review-tools">
    <a class="btn btn-ghost" href="index.html">Back to the game</a>
    <button class="btn btn-ghost" id="revealBtn" type="button" aria-pressed="true">Hide details</button>
  </div>
</header>

<main class="review">
  <div class="photo-frame review-frame">
    <img id="fishPhotoBg" class="photo-bg" alt="" src="" aria-hidden="true">
    <img id="fishPhoto" class="photo" alt="Fish photograph under review" src="">
  </div>

  <!-- Name and credit only, never the region: that is the game's answer. Shown
       by default so a bad photo can be named; the toggle hides it to judge a
       picture cold, the way a player meets it. -->
  <div class="review-details" id="details">
    <h1 class="review-name" id="fishName">—</h1>
    <p class="review-sci" id="fishSci">—</p>
    <p class="review-meta" id="fishMeta">—</p>
  </div>

  <div class="review-bar">
    <button class="btn btn-ghost" id="prevBtn" type="button" aria-label="Previous photo">‹ Prev</button>

    <label class="review-jump">
      <span class="review-jump-label">Fish</span>
      <input class="review-jump-input" id="jump" type="number" min="1" step="1"
             inputmode="numeric" aria-label="Jump to fish number">
      <span class="review-count" id="count">of —</span>
    </label>

    <button class="btn btn-primary" id="nextBtn" type="button" aria-label="Next photo">Next ›</button>
  </div>

  <p class="review-hint">Arrow keys step through. <kbd>R</kbd> hides the details to judge a photo cold.</p>
</main>

<script src="src/version.js"></script>
<script src="src/regions.js"></script>
<script src="src/fish.js"></script>
<script src="src/credits.js"></script>
<script src="src/photos.js"></script>
</body>
</html>
